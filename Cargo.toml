[package]
name = "algo_reverb"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
default-run = "reverb-cli"

[dependencies]
eframe = { version = "0.33.3", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
hound = { version = "3.5.1", optional = true }
rfd = { version = "0.15.4", optional = true }
rodio = { version = "0.21.1", optional = true, default-features = false, features = ["playback"] }
nice-plug-core = { version = "0.4.2", optional = true }
nice-plug-egui = { version = "0.6.0", optional = true }
nice-plug = { version = "0.4.2", optional = true, default-features = false, features = ["editor", "vst3"] }
egui-plugin = { package = "egui", version = "0.37.0", optional = true, features = ["default_fonts"] }

[features]
default = []
gui = ["dep:eframe", "dep:hound", "dep:rfd", "dep:rodio"]
plugin = ["dep:nice-plug", "dep:nice-plug-core", "dep:nice-plug-egui", "dep:egui-plugin"]

[[bin]]
name = "reverb-cli"
path = "src/main.rs"

[[bin]]
name = "reverb-lab"
path = "src/bin/reverb_lab.rs"
required-features = ["gui"]

[lib]
crate-type = ["rlib", "cdylib"]

[workspace]
members = ["xtask"]
resolver = "2"

[patch.crates-io]
nice-plug-egui = { path = "ext/nice-plug/crates/nice-plug-egui" }
egui_knob = { path = "ext/egui_knob" }