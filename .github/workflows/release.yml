name: Release plugins

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            targets: x86_64-unknown-linux-gnu
          - os: macos-26
            platform: macos-universal
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            platform: windows-x86_64
            targets: x86_64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-util-dev \
            libxcb-cursor-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcb-keysyms1-dev libxcb-randr0-dev libxcb-render0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Setup MSVC and Windows SDK
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Pin MSVC linker for Cargo
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Git Bash can put Git's unrelated link.exe ahead of MSVC on PATH.
          # Set the absolute linker for both host tools and target plugin builds.
          if (-not $env:VCToolsInstallDir) {
            throw "MSVC setup did not provide VCToolsInstallDir"
          }
          $linker = Join-Path $env:VCToolsInstallDir "bin/Hostx64/x64/link.exe"
          if (-not (Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw "MSVC linker not found: $linker"
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV
          Write-Host "Cargo MSVC linker: $linker"

      - name: Install just
        uses: taiki-e/install-action@just

      - name: Setup patched plugin dependencies
        run: just setup-ext

      - name: Build VST3 and CLAP plugins
        if: runner.os != 'macOS'
        env:
          BUILD_TARGET: ${{ matrix.targets }}
        run: |
          cargo xtask bundle algo_reverb --release --locked --lib --features plugin --target "$BUILD_TARGET"
          cargo xtask bundle algo_vn --release --locked --lib --target "$BUILD_TARGET"

      - name: Build Universal macOS VST3 and CLAP plugins
        if: runner.os == 'macOS'
        run: |
          cargo xtask bundle-universal algo_reverb --release --locked --lib --features plugin
          cargo xtask bundle-universal algo_vn --release --locked --lib

      - name: Verify all plugin bundles
        run: |
          for plugin in "Algo Reverb" "Algo VN"; do
            for format in vst3 clap; do
              test -e "target/bundled/$plugin.$format"
            done
          done

      - name: Set archive name
        env:
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: |
          safe_ref=$(printf '%s' "$RELEASE_REF" | tr -c '[:alnum:]._-' '-')
          echo "RELEASE_NAME=algo-reverb-$safe_ref-$RELEASE_PLATFORM" >> "$GITHUB_ENV"

      - name: Package Linux and macOS plugins
        if: runner.os != 'Windows'
        run: |
          package_directory="dist/$RELEASE_NAME"
          mkdir -p "$package_directory"
          for plugin in "Algo Reverb" "Algo VN"; do
            cp -R "target/bundled/$plugin.vst3" "target/bundled/$plugin.clap" "$package_directory/"
          done
          cp RELEASE_README.md "$package_directory/README.md"
          cp LICENSE THIRD_PARTY_NOTICES.md "$package_directory/"
          mkdir -p "$package_directory/docs"
          cp docs/README.md docs/installation.md docs/plugins.md "$package_directory/docs/"
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$package_directory" "dist/$RELEASE_NAME.zip"
          else
            tar -C dist -czf "dist/$RELEASE_NAME.tar.gz" "$RELEASE_NAME"
          fi
          rm -rf "$package_directory"

      - name: Package Windows plugins
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDirectory = "dist/$env:RELEASE_NAME"
          New-Item -ItemType Directory -Force -Path $packageDirectory | Out-Null
          foreach ($plugin in @("Algo Reverb", "Algo VN")) {
            Copy-Item -Recurse "target/bundled/$plugin.vst3", "target/bundled/$plugin.clap" "$packageDirectory/"
          }
          Copy-Item RELEASE_README.md "$packageDirectory/README.md"
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md "$packageDirectory/"
          New-Item -ItemType Directory -Force -Path "$packageDirectory/docs" | Out-Null
          Copy-Item docs/README.md, docs/installation.md, docs/plugins.md "$packageDirectory/docs/"
          Compress-Archive -Path $packageDirectory -DestinationPath "dist/$env:RELEASE_NAME.zip"
          Remove-Item -Recurse -Force $packageDirectory

      - name: Upload plugin archive
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin archives
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true